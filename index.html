    <style>
        body {
            background-color: var(--custom-bg, #09090b);
            color: var(--custom-text, #ffffff);
            font-family: var(--custom-font, 'Lexend', sans-serif);
        }
        .clock-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .dh-btn, .ma-btn, .tq-btn, .mg-btn, .pp-btn, .tm-btn, .wz-btn, .sw-btn, .ef-btn, .dt-btn, .sl-btn, .gm-btn {

            flex-shrink: 0;
            border-radius: 0.75rem !important; /* rounded-xl */
        }
        .draggable-section {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .draggable-section.dragging {
            opacity: 0.4;
        }
        .drop-placeholder {
            width: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            transition: all 0.15s ease;
        }
    </style>
    <script>
        // Automatic about:blank cloaking on any letter key press or mouse click (left/right)
        (function() {
            if (window.location.protocol !== 'about:' && !window.frameElement && !sessionStorage.getItem('is_cloaked')) {
                const launchCloak = function(e) {
                    const isLetter = e.type === 'keydown' && e.key && /^[a-zA-Z]$/.test(e.key);
                    const isClick = e.type === 'click' || e.type === 'contextmenu';
                    
                    if (isLetter || isClick) {
                        if (sessionStorage.getItem('is_cloaked')) return;
                        sessionStorage.setItem('is_cloaked', 'true');
                        try {
                            const win = window.open('about:blank', '_blank');
                            if (win) {
                                const doc = win.document;
                                doc.open();
                                doc.write('<!DOCTYPE html><html><head><title>Home - TeachTCI</title></head><body style="margin:0;padding:0;background:#09090b;overflow:hidden;"><iframe src="' + window.location.href + '" style="border:none;width:100vw;height:100vh;display:block;"></iframe></body></html>');
                                doc.close();
                                window.location.replace("https://launchpad.classlink.com/login");
                            }
                        } catch (err) {}
                    }
                };

                window.addEventListener('keydown', launchCloak, { once: true });
                window.addEventListener('click', launchCloak, { once: true });
                window.addEventListener('contextmenu', launchCloak, { once: true });
            }
        })();
    </script>
